<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LinuxRush - Регистрация</title>
    <style>
        :root {
            --space: #0a0a1a;
            --nebula: #15152b;
            --comet: #00f2fe;
            --rocket: #ff6b35;
            --star: #ffd700;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', Arial, sans-serif;
            background: var(--space);
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }
        
        .space-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #0c0c2b 0%, #1a1a3e 100%);
            z-index: -1;
        }
        
        .stars {
            position: absolute;
            width: 100%;
            height: 100%;
            z-index: -1;
            opacity: 0.6;
        }
        
        .register-container {
            width: 100%;
            max-width: 500px;
            padding: 20px;
            z-index: 1;
        }
        
        .register-card {
            background: rgba(21, 21, 43, 0.9);
            border: 1px solid var(--comet);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
            position: relative;
            overflow: hidden;
        }
        
        .register-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--rocket), var(--comet));
        }
        
        .logo {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .logo-icon {
            color: var(--rocket);
            font-size: 3rem;
            margin-bottom: 15px;
            display: block;
        }
        
        .logo-text {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.2rem;
            font-weight: 900;
            background: linear-gradient(45deg, var(--star), var(--comet));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-label {
            display: block;
            color: var(--comet);
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 0.95rem;
        }
        
        .form-control {
            width: 100%;
            padding: 15px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(0, 242, 254, 0.3);
            border-radius: 12px;
            color: white;
            font-size: 1rem;
            transition: all 0.3s;
        }
        
        .form-control:focus {
            outline: none;
            border-color: var(--star);
            box-shadow: 0 0 0 3px rgba(255, 215, 0, 0.1);
            background: rgba(255, 255, 255, 0.08);
        }
        
        .password-strength {
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            margin-top: 5px;
            overflow: hidden;
        }
        
        .strength-bar {
            height: 100%;
            width: 0%;
            transition: all 0.3s ease;
            border-radius: 2px;
        }
        
        .strength-weak { background: var(--rocket); }
        .strength-medium { background: #ffcc00; }
        .strength-strong { background: var(--comet); }
        
        .btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 10px;
        }
        
        .btn-primary {
            background: linear-gradient(45deg, var(--rocket), #7c3aed);
            color: white;
            position: relative;
            overflow: hidden;
        }
        
        .btn-primary::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s;
        }
        
        .btn-primary:hover::before {
            left: 100%;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(255, 107, 53, 0.3);
        }
        
        .divider {
            text-align: center;
            margin: 30px 0;
            position: relative;
        }
        
        .divider::before {
            content: '';
            position: absolute;
            left: 0;
            top: 50%;
            width: 100%;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--comet), transparent);
        }
        
        .divider span {
            background: rgba(21, 21, 43, 0.9);
            padding: 0 20px;
            color: var(--comet);
            font-weight: 600;
            font-size: 0.9rem;
            position: relative;
        }
        
        .links {
            text-align: center;
            margin-top: 25px;
            color: rgba(255, 255, 255, 0.7);
        }
        
        .links a {
            color: var(--comet);
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s;
        }
        
        .links a:hover {
            color: var(--star);
            text-decoration: underline;
        }
        
        .alert {
            background: rgba(255, 107, 53, 0.1);
            border: 1px solid var(--rocket);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 25px;
            color: #ffb8a8;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .success {
            background: rgba(0, 242, 254, 0.1);
            border: 1px solid var(--comet);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 25px;
            color: #a6f9ff;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .form-text {
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.9rem;
            margin-top: 5px;
            display: block;
        }
        
        .form-check {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            margin-top: 20px;
        }
        
        .form-check-input {
            margin-top: 5px;
            accent-color: var(--comet);
        }
        
        .form-check-label {
            color: rgba(255, 255, 255, 0.8);
            font-size: 0.9rem;
            line-height: 1.5;
        }
        
        @media (max-width: 768px) {
            .register-container {
                padding: 15px;
            }
            
            .register-card {
                padding: 30px 25px;
            }
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div class="space-bg"></div>
    <div class="stars"></div>
    
    <div class="register-container">
        <div class="register-card">
            <div class="logo">
                <i class="fas fa-user-astronaut logo-icon"></i>
                <h1 class="logo-text">Присоединиться к эскадре</h1>
                <p style="color: rgba(255, 255, 255, 0.8); margin-top: 10px; text-align: center;">
                    Станьте частью космической команды LinuxRush
                </p>
            </div>
            
            <!-- Сообщения -->
            {% if messages %}
                {% for message in messages %}
                    <div class="{% if message.tags == 'error' %}alert{% else %}success{% endif %}">
                        <i class="fas fa-{% if message.tags == 'error' %}exclamation-circle{% else %}check-circle{% endif %}"></i>
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
            
            <!-- Форма регистрации -->
            <form method="POST" action="/register/">
                {% csrf_token %}
                
                <div class="form-group">
                    <label class="form-label">
                        <i class="fas fa-envelope me-1"></i>Email
                    </label>
                    <input type="email" name="email" class="form-control" placeholder="duck@linuxrush.space" required>
                    <span class="form-text">Для связи с эскадрой</span>
                </div>
                
                <div class="form-group">
                    <label class="form-label">
                        <i class="fas fa-key me-1"></i>Пароль
                    </label>
                    <input type="password" name="password1" id="password" class="form-control" placeholder="Создайте секретный код" required>
                    <div class="password-strength">
                        <div class="strength-bar" id="strengthBar"></div>
                    </div>
                    <span class="form-text">Минимум 8 символов, включая буквы и цифры</span>
                </div>
                
                <div class="form-group">
                    <label class="form-label">
                        <i class="fas fa-key me-1"></i>Подтверждение пароля
                    </label>
                    <input type="password" name="password2" class="form-control" placeholder="Повторите секретный код" required>
                </div>
                
                <div class="form-check">
                    <input type="checkbox" name="terms" id="terms" class="form-check-input" required>
                    <label class="form-check-label" for="terms">
                        Я согласен с космическим договором и политикой конфиденциальности
                    </label>
                </div>

                <button type="submit" class="btn btn-primary">
                    <i class="fas fa-rocket"></i>
                    Запустить аккаунт
                </button>
            </form>
            
            <!-- Ссылки -->
            <div class="links">
                <p>
                    Уже в эскадре? 
                    <a href="/login/">Войти в космос</a>
                </p>
                <p style="margin-top: 10px;">
                    <a href="/">
                        <i class="fas fa-arrow-left me-1"></i>
                        Вернуться на главную
                    </a>
                </p>
            </div>
        </div>
    </div>
    
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Автофокус на поле email
            setTimeout(() => {
                const emailInput = document.querySelector('input[name="email"]');
                if (emailInput) emailInput.focus();
            }, 100);
            
            // Проверка сложности пароля
            const passwordInput = document.getElementById('password');
            const strengthBar = document.getElementById('strengthBar');
            
            if (passwordInput && strengthBar) {
                passwordInput.addEventListener('input', function() {
                    const password = this.value;
                    let strength = 0;
                    
                    if (password.length >= 8) strength += 25;
                    if (/[A-Z]/.test(password)) strength += 25;
                    if (/[0-9]/.test(password)) strength += 25;
                    if (/[^A-Za-z0-9]/.test(password)) strength += 25;
                    
                    strengthBar.style.width = strength + '%';
                    
                    if (strength < 50) {
                        strengthBar.className = 'strength-bar strength-weak';
                    } else if (strength < 75) {
                        strengthBar.className = 'strength-bar strength-medium';
                    } else {
                        strengthBar.className = 'strength-bar strength-strong';
                    }
                });
            }
            
            // Валидация формы
            const form = document.querySelector('form');
            if (form) {
                form.addEventListener('submit', function(e) {
                    const email = this.querySelector('input[name="email"]');
                    const password1 = this.querySelector('input[name="password1"]');
                    const password2 = this.querySelector('input[name="password2"]');
                    const terms = document.getElementById('terms');
                    
                    // Проверка email
                    if (!email.value.includes('@') || !email.value.includes('.')) {
                        e.preventDefault();
                        alert('Введите корректный email');
                        email.style.borderColor = 'var(--rocket)';
                        return false;
                    }
                    
                    // Проверка паролей
                    if (password1.value !== password2.value) {
                        e.preventDefault();
                        alert('Пароли не совпадают');
                        password2.style.borderColor = 'var(--rocket)';
                        return false;
                    }
                    
                    // Длина пароля
                    if (password1.value.length < 8) {
                        e.preventDefault();
                        alert('Пароль должен быть не менее 8 символов');
                        password1.style.borderColor = 'var(--rocket)';
                        return false;
                    }
                    
                    // Проверка чекбокса
                    if (!terms.checked) {
                        e.preventDefault();
                        alert('Необходимо согласиться с условиями');
                        return false;
                    }
                    
                    // Сброс цвета
                    email.style.borderColor = '';
                    password1.style.borderColor = '';
                    password2.style.borderColor = '';
                });
            }
            
            // Сброс цвета при вводе
            const inputs = document.querySelectorAll('.form-control');
            inputs.forEach(input => {
                input.addEventListener('input', function() {
                    this.style.borderColor = '';
                });
            });
        });
    </script>
</body>
</html>
